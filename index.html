<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ICC PAY - Universal UPI Payment Engine</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Inter:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-container-highest": "#d3e4fe",
                        "primary-container": "#2563eb",
                        "on-surface-variant": "#434655",
                        "outline-variant": "#c3c6d7",
                        "secondary-container": "#7cf994",
                        "on-tertiary-container": "#ffecea",
                        "tertiary": "#ae0010",
                        "inverse-surface": "#213145",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed-variant": "#93000b",
                        "on-secondary-container": "#007230",
                        "on-secondary-fixed": "#002109",
                        "secondary": "#006e2d",
                        "primary": "#004ac6",
                        "error-container": "#ffdad6",
                        "on-tertiary": "#ffffff",
                        "surface-container-low": "#eff4ff",
                        "background": "#f8f9ff",
                        "surface-container-high": "#dce9ff",
                        "primary-fixed-dim": "#b4c5ff",
                        "surface": "#f8f9ff",
                        "on-primary": "#ffffff",
                        "surface-bright": "#f8f9ff",
                        "inverse-on-surface": "#eaf1ff",
                        "tertiary-fixed": "#ffdad6",
                        "tertiary-container": "#d52022",
                        "primary-fixed": "#dbe1ff",
                        "on-background": "#0b1c30",
                        "surface-variant": "#d3e4fe",
                        "surface-tint": "#0053db",
                        "secondary-fixed": "#7ffc97",
                        "on-surface": "#0b1c30",
                        "surface-dim": "#cbdbf5",
                        "on-primary-container": "#eeefff",
                        "error": "#ba1a1a",
                        "on-primary-fixed-variant": "#003ea8",
                        "outline": "#737686",
                        "on-error-container": "#93000a",
                        "on-secondary-fixed-variant": "#005320",
                        "tertiary-fixed-dim": "#ffb4ab",
                        "on-tertiary-fixed": "#410002",
                        "secondary-fixed-dim": "#62df7d",
                        "on-error": "#ffffff",
                        "on-secondary": "#ffffff",
                        "inverse-primary": "#b4c5ff",
                        "on-primary-fixed": "#00174b",
                        "surface-container": "#e5eeff"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "margin-desktop": "40px",
                        "gutter": "24px",
                        "container-max": "1280px",
                        "unit-xl": "48px",
                        "unit-sm": "8px",
                        "unit-lg": "24px",
                        "unit-xs": "4px",
                        "margin-mobile": "20px",
                        "unit-md": "16px"
                    },
                    fontFamily: {
                        "code-mono": ["Geist"],
                        "label-sm": ["Geist"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "display-lg-mobile": ["Geist"],
                        "display-lg": ["Geist"],
                        "headline-md": ["Geist"]
                    },
                    fontSize: {
                        "code-mono": ["14px", { lineHeight: "20px", fontWeight: "400" }],
                        "label-sm": ["14px", { lineHeight: "20px", letterSpacing: "0.02em", fontWeight: "500" }],
                        "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
                        "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
                        "display-lg-mobile": ["36px", { lineHeight: "44px", letterSpacing: "-0.02em", fontWeight: "600" }],
                        "display-lg": ["48px", { lineHeight: "56px", letterSpacing: "-0.02em", fontWeight: "600" }],
                        "headline-md": ["24px", { lineHeight: "32px", letterSpacing: "-0.01em", fontWeight: "600" }]
                    },
                    boxShadow: {
                        'card': '0px 4px 20px rgba(0, 0, 0, 0.03), 0px 2px 4px rgba(0, 0, 0, 0.02)',
                    }
                },
            },
        }
    </script>
<style>
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(241, 245, 249, 0.5);
        }
        
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 0; }
        }
        
        .status-pulse::before {
            content: '';
            position: absolute;
            left: -4px;
            top: -4px;
            right: -4px;
            bottom: -4px;
            border-radius: 50%;
            border: 2px solid #2563EB;
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        /* Hide number input spinners */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-container-lowest text-on-surface antialiased min-h-screen flex flex-col items-center">
<!-- TopAppBar Container -->
<header class="w-full max-w-[600px] flex flex-col items-center justify-center pt-unit-xl pb-unit-lg px-margin-mobile text-center bg-surface-container-lowest sticky top-0 z-10 transition-transform duration-100 scale-95 origin-top">
<div class="flex items-center justify-center gap-2 mb-2">
<span class="material-symbols-outlined text-primary-container text-3xl" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
<h1 class="font-headline-md text-headline-md font-bold text-primary-container tracking-tight">ICC PAY</h1>
</div>
<p class="font-body-md text-body-md text-outline">Universal UPI Payment Engine</p>
</header>
<!-- Main Content Area -->
<main class="w-full max-w-[600px] px-margin-mobile pb-unit-xl flex flex-col gap-unit-xl mt-4">
<!-- Amount Input Section -->
<section class="flex flex-col items-center w-full">
<div class="relative w-full max-w-[320px] mx-auto group">
<div class="absolute inset-y-0 left-0 pl-6 flex items-center pointer-events-none">
<span class="font-display-lg text-display-lg text-on-surface-variant group-focus-within:text-primary-container transition-colors">₹</span>
</div>
<input class="w-full bg-surface-container-lowest border border-[#E2E8F0] rounded-[14px] py-6 pl-16 pr-6 font-display-lg-mobile text-display-lg-mobile text-center text-on-surface placeholder-outline-variant focus:outline-none focus:ring-0 focus:border-primary-container focus:shadow-[0_0_0_3px_rgba(37,99,235,0.2)] transition-all shadow-sm" min="1" placeholder="0.00" step="0.01" type="number"/>
</div>
<button class="mt-8 w-full max-w-[320px] bg-primary-container text-on-primary font-label-sm text-label-sm rounded-[14px] py-4 px-6 hover:bg-[#1D4ED8] active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-[0_4px_14px_0_rgba(37,99,235,0.39)]">
<span class="material-symbols-outlined text-[20px]">qr_code_scanner</span>
                Generate QR &amp; Pay
            </button>
</section>
<!-- Dynamic Sections (Waiting State Structure) -->
<div class="flex flex-col gap-6 opacity-40 grayscale pointer-events-none transition-all duration-500 ease-in-out" id="payment-sections">
<!-- Bento Grid Layout for Payment Info -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- QR Code Card -->
<div class="bg-surface-container-lowest rounded-[14px] p-unit-lg shadow-card border border-[#F1F5F9] flex flex-col items-center justify-center aspect-square relative overflow-hidden">
<div class="w-48 h-48 border-2 border-dashed border-outline-variant rounded-lg flex items-center justify-center bg-[#F8FAFC]">
<span class="material-symbols-outlined text-outline-variant text-4xl">qr_code</span>
</div>
<p class="font-label-sm text-label-sm text-outline-variant mt-4 text-center">Awaiting amount entry</p>
</div>
<div class="flex flex-col gap-6">
<!-- Status Card -->
<div class="bg-surface-container-lowest rounded-[14px] p-unit-lg shadow-card border border-[#F1F5F9] flex-1 flex flex-col items-center justify-center relative">
<div class="relative w-12 h-12 rounded-full bg-[#F1F5F9] flex items-center justify-center mb-3">
<span class="material-symbols-outlined text-outline-variant">hourglass_empty</span>
<!-- The animated pulse ring would be applied here in active state via .status-pulse class -->
</div>
<h3 class="font-body-lg text-body-lg font-medium text-on-surface">Waiting for input</h3>
<p class="font-body-md text-body-md text-outline-variant mt-1 text-center">Session not initiated</p>
</div>
<!-- Payment Link Card -->
<div class="bg-surface-container-lowest rounded-[14px] p-unit-md shadow-card border border-[#F1F5F9]">
<label class="font-label-sm text-label-sm text-outline-variant block mb-2">UPI Payment Link</label>
<div class="flex items-center gap-2">
<div class="bg-[#F8FAFC] border border-[#E2E8F0] rounded-lg px-3 py-2 flex-1 overflow-hidden">
<span class="font-code-mono text-code-mono text-outline-variant truncate block">upi://pay?pa=...</span>
</div>
<button class="w-10 h-10 rounded-lg bg-[#F1F5F9] text-on-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined text-[20px]">content_copy</span>
</button>
</div>
</div>
</div>
</div>
<!-- Transaction Details Card -->
<div class="bg-surface-container-lowest rounded-[14px] p-unit-lg shadow-card border border-[#F1F5F9] w-full">
<h3 class="font-body-lg text-body-lg font-medium text-on-surface mb-4 pb-4 border-b border-[#F1F5F9] flex items-center gap-2">
<span class="material-symbols-outlined text-outline-variant">receipt_long</span>
                    Transaction Details
                </h3>
<ul class="flex flex-col gap-4">
<li class="flex justify-between items-center py-1">
<span class="font-body-md text-body-md text-outline-variant">Amount</span>
<span class="font-code-mono text-code-mono text-on-surface font-medium">--</span>
</li>
<li class="flex justify-between items-center py-1">
<span class="font-body-md text-body-md text-outline-variant">Terminal Ref (TR)</span>
<span class="font-code-mono text-code-mono text-on-surface font-medium">--</span>
</li>
<li class="flex justify-between items-center py-1">
<span class="font-body-md text-body-md text-outline-variant">Transaction ID</span>
<span class="font-code-mono text-code-mono text-on-surface font-medium">--</span>
</li>
<li class="flex justify-between items-center py-1 pt-3 border-t border-[#F1F5F9] mt-2">
<span class="font-body-md text-body-md text-outline-variant">Status</span>
<span class="bg-[#F1F5F9] text-outline-variant px-2 py-1 rounded-[6px] font-label-sm text-label-sm">Pending</span>
</li>
</ul>
</div>
</div>
</main>
</body></html>
